<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Favicon HachimiMT: con triện son 譯 (Dịch), khớp logo header -->
  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8553a"/>
      <stop offset="100%" stop-color="#a8331f"/>
    </linearGradient>
  </defs>
  <!-- nền giấy bo góc -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#f4ecdc"/>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none" stroke="#d8cbb1" stroke-width="1.5"/>
  <!-- con triện vuông son -->
  <rect x="11" y="11" width="42" height="42" rx="8" fill="url(#seal)"/>
  <rect x="11" y="11" width="42" height="42" rx="8" fill="none" stroke="#7d2414" stroke-width="1" opacity="0.5"/>
  <!-- chữ 譯 (Dịch) trắng -->
  <text x="32" y="33" font-family="'Noto Serif SC','Songti SC',serif" font-size="30"
        font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">譯</text>
</svg>
