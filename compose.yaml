name: novel-tool
services:
  web:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    init: true
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - webdata:/app/data
      - ./models/translation:/app/models/translation
      - ./models/voices:/app/models/voices
      - ./output_text:/app/output_text
      - ./output_audio:/app/output_audio
      - cache:/cache
    stop_grace_period: 120s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  tts:
    profiles: [tts]
    build:
      context: .
      dockerfile: tts/Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    init: true
    volumes:
      - ./models/voices:/app/models/voices:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  cache:
  webdata:
